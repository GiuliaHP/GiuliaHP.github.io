<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- served by the app's own loopback server, so entry media resolve through
       exactly the relative paths the published page uses -->
  <base href="/">
  <link rel="stylesheet" href="/assets/css/carnet-entry.css">
  <script src="/assets/js/carnet-sanitize.js"></script>
  <title>Giulia HP — Carnet</title>
  <style>
    :root { color-scheme:dark; --bg:#0b0e1a; --panel:#121731; --border:#2a3158; --text:#e8eaff; --muted:#9ba2c7; --accent:#809eff; --violet:#6e4aff; --bold:#bcd4ff; --page:1002px; }
    * { box-sizing:border-box; } html,body { height:100%; } body { background:radial-gradient(circle at 15% 0,#1a2145 0,var(--bg) 42%); color:var(--text); display:flex; flex-direction:column; font:14px Inter,Segoe UI,sans-serif; margin:0; overflow:hidden; }
    header { align-items:center; border-bottom:1px solid var(--border); display:flex; flex:none; gap:14px; justify-content:space-between; padding:7px 18px; } .brand { align-items:center; display:flex; font:600 16px "Space Grotesk",sans-serif; gap:9px; } .brand img { height:22px; object-fit:contain; width:22px; } .muted { color:var(--muted); }
    main { display:grid; flex:1; gap:14px; grid-template-columns:220px minmax(0,1fr); margin:0; min-height:0; padding:10px 14px; width:100%; } .editor-column { --gutter:max(0px,calc((100% - var(--page)) / 2)); display:flex; flex-direction:column; min-height:0; min-width:0; width:100%; } /* the controls span the panel, like the canvas below them */ .form-grid { display:grid; flex:none; gap:8px 12px; grid-template-columns:2fr 1fr; } label { color:var(--muted); display:grid; font-size:12px; gap:6px; } label.full { grid-column:1/-1; } input { background:#0c1023; border:1px solid var(--border); border-radius:8px; color:var(--text); font:inherit; outline:none; padding:7px 10px; width:100%; } input:focus,[contenteditable]:focus { border-color:var(--accent); box-shadow:0 0 0 3px #809eff22; } .editor:focus { box-shadow:inset 0 0 0 1px var(--accent),0 0 0 3px #809eff22; }
    .toolbar { align-items:center; display:flex; flex-wrap:wrap; gap:6px; } .toolbar-sep { background:var(--border); flex:none; height:18px; width:1px; } .toolbar button.on { background:var(--violet); border-color:var(--accent); } button { background:#202952; border:1px solid var(--border); border-radius:7px; color:var(--text); cursor:pointer; padding:6px 10px; } button:hover { border-color:var(--accent); } button.primary { background:linear-gradient(135deg,var(--violet),#4b78e8); border:0; font-weight:600; padding:8px 16px; }
    .editor-wrap { display:flex; flex:1; flex-direction:column; min-height:0; } .editor-label { color:var(--muted); display:block; font-size:12px; margin-top:8px; } .editor { background:#0c1023; border:0; border-radius:10px; box-shadow:inset 0 0 0 1px var(--border); flex:1; font:16px/1.7 Inter,Arial,sans-serif; margin:6px 0 0; min-height:0; overflow-y:auto; padding:24px max(28px,calc((100% - var(--page)) / 2)); outline:none; width:100%; } .editor:empty::before { color:var(--muted); content:attr(data-placeholder); pointer-events:none; }    .sidebar { background:#0e1226; border:1px solid var(--border); border-radius:12px; display:flex; flex-direction:column; min-height:0; overflow:hidden; }
    .sidebar-head { align-items:center; border-bottom:1px solid var(--border); display:flex; gap:8px; justify-content:space-between; padding:9px 11px; } .sidebar-head h2 { font:600 14px "Space Grotesk",sans-serif; margin:0; } .sidebar-head button { font-size:12px; padding:6px 10px; }
    .entry-list { display:flex; flex:1; flex-direction:column; gap:5px; min-height:0; overflow-y:auto; padding:7px; }
    .entry-item { background:#141a35; border:1px solid transparent; border-radius:9px; display:grid; gap:3px; grid-template-columns:1fr auto; overflow:hidden; padding:7px 9px; position:relative; } .entry-item.tinted { padding-left:15px; } .entry-item.tinted::before { background:linear-gradient(180deg,var(--entry-a),var(--entry-b)); bottom:0; content:""; left:0; position:absolute; top:0; width:3px; } .entry-item.tinted .entry-open strong { color:var(--entry-a); } @supports ((background-clip:text) or (-webkit-background-clip:text)) { .entry-item.tinted.gradient .entry-open strong { -webkit-background-clip:text; background-clip:text; background-image:linear-gradient(95deg,var(--entry-a),var(--entry-b)); color:transparent; } } .entry-open .mini-tag { color:var(--tag); }
    .entry-item:hover { border-color:var(--border); } .entry-item.current { background:#1b2350; border-color:var(--accent); }
    .entry-open { all:unset; cursor:pointer; display:grid; gap:3px; min-width:0; } .entry-open strong { color:var(--text); font-size:13px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; } .entry-open span { color:var(--muted); font-size:11px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .entry-delete { align-self:start; background:transparent; border-color:transparent; color:var(--muted); line-height:1; padding:4px 7px; } .entry-delete:hover { background:#3a1b2c; border-color:#ff9b9b; color:#ff9b9b; }
    .confirm { align-items:center; color:#ffc9c9; display:flex; font-size:12px; gap:6px; grid-column:1/-1; padding-top:6px; } .confirm button { font-size:12px; padding:4px 9px; } .confirm .yes { background:#5c1f33; border-color:#ff9b9b; }
    .sidebar-empty { color:var(--muted); font-size:12px; padding:14px 16px; }
    .media-selected { box-shadow:0 0 0 2px var(--accent),0 0 0 7px #809eff2e; } .media-dragging { opacity:.35; } .editor img,.editor video { cursor:pointer; } .resize-handle { background:var(--accent); border:2px solid #0b0e1a; border-radius:3px; cursor:ew-resize; height:18px; position:fixed; width:18px; z-index:45; } .resize-handle[hidden] { display:none; } .resize-readout { background:#1b2350; border:1px solid var(--accent); border-radius:6px; color:var(--text); font-size:11px; padding:3px 7px; position:fixed; z-index:46; } .resize-readout[hidden] { display:none; }
    .drop-marker { background:var(--accent); border-radius:2px; box-shadow:0 0 10px var(--accent); height:3px; pointer-events:none; position:fixed; z-index:40; } .drop-marker[hidden] { display:none; }
    .media-toolbar { align-items:center; background:#1b2350; border:1px solid var(--accent); border-radius:9px; box-shadow:0 12px 26px #05060caa; display:flex; gap:4px; padding:5px 6px; position:fixed; z-index:50; } .media-toolbar[hidden] { display:none; } .media-toolbar button { background:#0c1023; font-size:12px; line-height:1; padding:6px 9px; } .media-toolbar button.on { background:var(--violet); border-color:var(--accent); } .media-toolbar button:disabled { color:var(--muted); cursor:default; opacity:.45; } .media-toolbar button.danger:hover { background:#5c1f33; border-color:#ff9b9b; color:#ff9b9b; } .media-toolbar .sep { background:var(--border); flex:none; height:18px; width:1px; } .media-toolbar .scale-field { align-items:center; color:var(--muted); display:flex; font-size:11px; gap:2px; } .media-toolbar .scale-field input { background:#0c1023; border:1px solid var(--border); border-radius:6px; color:var(--text); font:inherit; font-size:12px; padding:5px 4px; text-align:right; width:52px; }
    .tag-field { position:relative; } .tag-suggest { background:#0e1226; border:1px solid var(--accent); border-radius:9px; box-shadow:0 14px 28px #05060cbb; left:0; max-height:212px; overflow-y:auto; padding:4px; position:absolute; right:0; top:calc(100% + 4px); z-index:30; } .tag-suggest[hidden] { display:none; }
    .tag-suggest button { align-items:center; background:transparent; border-color:transparent; display:flex; gap:9px; padding:7px 9px; text-align:left; width:100%; } .tag-suggest button.active,.tag-suggest button:hover { background:#1b2350; border-color:var(--accent); } .tag-suggest .dot { background:var(--dot,var(--accent)); border-radius:50%; flex:none; height:10px; width:10px; } .tag-suggest .name { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; } .tag-suggest .count { color:var(--muted); font-size:11px; margin-left:auto; }
    .tag-colors { align-items:center; display:flex; flex-wrap:wrap; gap:8px; grid-column:1/-1; } .tag-colors:empty { display:none; }
    .tag-chip { align-items:center; background:#141a35; border:1px solid var(--chip); border-radius:999px; display:flex; gap:7px; padding:3px 11px 3px 3px; } .tag-chip span { color:var(--chip); font-size:12px; font-weight:600; }
    .tag-chip input[type=color] { background:none; border:0; cursor:pointer; height:24px; padding:0; width:24px; } .tag-chip input[type=color]::-webkit-color-swatch-wrapper { padding:0; } .tag-chip input[type=color]::-webkit-color-swatch { border:1px solid #ffffff33; border-radius:50%; }
    .accent-preview { border-left:2px solid var(--entry-a,var(--violet)); grid-column:1/-1; padding:2px 0 2px 14px; position:relative; } .accent-preview[hidden] { display:none; } .accent-preview em { color:var(--muted); display:block; font-size:11px; font-style:normal; letter-spacing:.08em; text-transform:uppercase; } .accent-preview strong { color:var(--entry-a,var(--text)); display:block; font:600 22px/1.2 "Space Grotesk",sans-serif; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .accent-preview.gradient { border-left-color:transparent; } .accent-preview.gradient::before { background:linear-gradient(180deg,var(--entry-a),var(--entry-b)); bottom:0; content:""; left:-2px; position:absolute; top:0; width:2px; } .accent-preview.gradient strong { -webkit-background-clip:text; background-clip:text; background-image:linear-gradient(95deg,var(--entry-a),var(--entry-b)); color:transparent; }
    .actions { align-items:center; display:flex; flex:none; gap:12px; justify-content:space-between; padding-top:8px; } #status { color:var(--muted); min-height:20px; } #status.error { color:#ff9b9b; }
    @media (max-width:1100px) { main { grid-template-columns:1fr; grid-template-rows:minmax(140px,24%) minmax(0,1fr); } }
    @media (max-width:900px) { header { padding:12px 16px; } main { padding:12px; } .form-grid { grid-template-columns:1fr; } label.full { grid-column:auto; } }
  </style>
</head>

  <main>
    <aside class="sidebar">
      <div class="sidebar-head">
        <h2>Entrées</h2>
        <button type="button" id="new-entry">+ Nouvelle</button>
      </div>
      <div id="entry-list" class="entry-list" aria-label="Entrées enregistrées"></div>

      <div class="tag-colors" id="tag-colors" aria-label="Couleurs des tags"></div>
      <div class="accent-preview" id="accent-preview" hidden><em>Aperçu du cadre et du titre</em><strong id="accent-preview-title"></strong></div>
    </div>
    <div class="editor-wrap">
      <span class="editor-label" id="editor-label">Texte riche</span>
      <div class="toolbar" aria-label="Mise en forme">
        <button type="button" data-command="bold"><strong>Gras</strong></button><button type="button" data-command="italic"><em>Italique</em></button>
        <button type="button" data-block="H2">H2</button><button type="button" data-block="H3">H3</button><button type="button" data-command="insertUnorderedList">Liste</button>
        <span class="toolbar-sep"></span>
        <button type="button" data-command="justifyLeft" data-align-state="left" title="Aligner le texte à gauche">◰</button><button type="button" data-command="justifyCenter" data-align-state="center" title="Centrer le texte">◳</button><button type="button" data-command="justifyRight" data-align-state="right" title="Aligner le texte à droite">◲</button><button type="button" data-command="justifyFull" data-align-state="justify" title="Justifier le texte">▦</button>
        <span class="toolbar-sep"></span>
        <button type="button" id="link">Lien</button><button type="button" id="add-media">Ajouter des médias</button>
      </div>
      <div id="editor" class="editor entry-body" contenteditable="true" role="textbox" aria-multiline="true" aria-labelledby="editor-label" data-placeholder="Écrivez votre entrée…"></div>
    </div>
    <div class="actions"><span id="status" role="status"></span><button class="primary" id="save">Enregistrer l'entrée</button></div>
    </div>
  </main>

    <span class="sep"></span>
    <button type="button" id="media-replace" title="Remplacer le fichier">Remplacer</button><button type="button" class="danger" id="media-remove" title="Supprimer le média (Suppr)">✕</button>

  <div class="resize-readout" id="resize-readout" hidden></div>

  <div class="resize-readout" id="resize-readout" hidden></div>
  <script>
    const $ = (id) => document.getElementById(id); let currentId = ""; let savedRange = null; let bridgeReady = false;
    let entries = []; let pendingDelete = ""; let tagColors = {}; let tagColorTimer = 0;
    let selectedMedia = null; let draggedMedia = null; let dropRange = null; let suggestions = []; let suggestIndex = -1;
    $("entry-date").value = new Date().toISOString().slice(0, 10);
    function focusEditor() { $("editor").focus(); if (savedRange) { const selection = getSelection(); selection.removeAllRanges(); selection.addRange(savedRange); } }
    function saveSelection() { const selection = getSelection(); if (selection.rangeCount && $("editor").contains(selection.anchorNode)) savedRange = selection.getRangeAt(0).cloneRange(); }
    const MEDIA_SELECTOR = "img,video";
    const ALIGNMENTS = ["inline", "left", "right", "center"];   // left/right float, so text wraps beside them
    // Width is a share of the text column, in the steps carnet-entry.css declares.
    const WIDTHS = window.CarnetSanitize.WIDTHS.map(Number);
    const WIDTH_MIN = WIDTHS[0], WIDTH_MAX = WIDTHS[WIDTHS.length - 1], WIDTH_STEP = 5;
    function mediaBlock(node) {
      const start = node instanceof Element ? node : node && node.parentElement;
      const block = start && start.closest(MEDIA_SELECTOR);

        input.setSelectionRange(Math.max(0, caret - shift), Math.max(0, caret - shift));
      }
      renderTagColors();
      updateTagSuggestions();
      clearTimeout(tagColorTimer);
      tagColorTimer = setTimeout(refreshTagColors, 300);
    });
    $("tags").addEventListener("keydown", (event) => {
      const open = suggestions.length > 0;
      if (event.key === "ArrowDown" || event.key === "ArrowUp") {
        if (!open) { updateTagSuggestions(); return; }
        event.preventDefault();
        const step = event.key === "ArrowDown" ? 1 : -1;
        suggestIndex = suggestIndex < 0
          ? (step === 1 ? 0 : suggestions.length - 1)
          : (suggestIndex + step + suggestions.length) % suggestions.length;
        renderTagSuggestions();
        return;
      }
      if (open && suggestIndex >= 0 && (event.key === "Enter" || event.key === "Tab")) { event.preventDefault(); chooseTag(suggestions[suggestIndex].tag); return; }
      if (open && event.key === "Escape") { event.preventDefault(); closeTagSuggestions(); }
    });
    $("tags").addEventListener("focus", updateTagSuggestions);
    $("tags").addEventListener("click", updateTagSuggestions);
    $("tags").addEventListener("blur", () => { $("tags").value = currentTags().join(", "); closeTagSuggestions(); renderTagColors(); });
    $("title").addEventListener("input", () => renderAccentPreview(currentTags()));
    // Saved media already carry a project-relative src, and <base href="/"> makes
    // the local server resolve it exactly as the published page does.
    function hydrateMedia(root) {
      root.querySelectorAll("img,video").forEach((element) => {
        element.dataset.mediaKind = element.tagName === "VIDEO" ? "video" : "image";
        applyMediaLayout(element);
      });
    }
    function renderEntryList() {
      $("entry-list").textContent = "";
      $("entry-list-empty").hidden = entries.length > 0;
      entries.forEach((entry) => {
        const item = document.createElement("div");
        item.className = entry.id === currentId ? "entry-item current" : "entry-item";
        const open = document.createElement("button");
        open.type = "button";
        open.className = "entry-open";
        const tagList = entryTagList(entry);
        const palette = tagList.map(colorFor).filter(Boolean);
        if (palette.length) {
          item.classList.add("tinted");
          if (palette.length > 1) item.classList.add("gradient");
          item.style.setProperty("--entry-a", palette[0]);
          item.style.setProperty("--entry-b", palette[1] || palette[0]);
        }
        const labels = tagList.map((tag) => {
          const color = colorFor(tag);
          return color ? `<span class="mini-tag" style="--tag:${color}">${escapeText(tag)}</span>` : escapeText(tag);
        }).join(", ");
        open.innerHTML = `<strong>${escapeText(entry.title || "(sans titre)")}</strong><span>${escapeText(entry.date || "")}${labels ? " · " + labels : ""}</span>`;
        open.addEventListener("click", () => loadEntry(entry));
        const remove = document.createElement("button");
        remove.type = "button";
        remove.className = "entry-delete";
        remove.title = "Supprimer cette entrée";
        remove.textContent = "✕";
        remove.addEventListener("click", () => { pendingDelete = pendingDelete === entry.id ? "" : entry.id; renderEntryList(); });
        item.append(open, remove);
        if (pendingDelete === entry.id) {
          const row = document.createElement("div");
          row.className = "confirm";
          const question = document.createElement("span");
          question.textContent = "Supprimer définitivement ?";
          const yes = document.createElement("button");
          yes.type = "button"; yes.className = "yes"; yes.textContent = "Supprimer";
          yes.addEventListener("click", () => deleteEntry(entry.id));
          const no = document.createElement("button");
          no.type = "button"; no.textContent = "Annuler";
          no.addEventListener("click", () => { pendingDelete = ""; renderEntryList(); });
          row.append(question, yes, no);
          item.append(row);
        }
        $("entry-list").append(item);
      });
    }
    async function refreshEntries() {
      entries = await requireBridge("get_entries").get_entries();
      pendingDelete = "";
      renderEntryList();
    }
    async function loadEntry(entry) {
      setStatus("Ouverture…");
      try {
        clearMediaSelection();
        const holder = document.createElement("div");
        // clean on the way in too: the canvas must never show formatting the
        // published page would strip, or the preview lies before you touch anything
        const loaded = window.CarnetSanitize.sanitize(entry.body || "");
        holder.innerHTML = loaded.html;
        // the stored alignment becomes an inline style again, which is what execCommand reads
        holder.querySelectorAll("[data-text-align]").forEach((element) => {
          if (TEXT_ALIGNS.includes(element.dataset.textAlign)) element.style.textAlign = element.dataset.textAlign;
        });
        hydrateMedia(holder);
        currentId = entry.id;
        $("title").value = entry.title || "";
        $("entry-date").value = entry.date || new Date().toISOString().slice(0, 10);
        $("tags").value = Array.isArray(entry.tags) ? entry.tags.join(", ") : (entry.tags || "");
        $("editor").innerHTML = holder.innerHTML;
        savedRange = null;
        pendingDelete = "";
        closeTagSuggestions();
        renderEntryList();
        await refreshTagColors();
        setStatus(loaded.stripped.length
          ? `Entrée ouverte : ${entry.title || entry.id} — mise en forme non publiable ignorée (${loaded.stripped.join(", ")}).`
          : `Entrée ouverte : ${entry.title || entry.id}`);
      } catch (error) {
        setStatus(error.message || String(error), true);
      }
    }
    function resetForm() {
      currentId = ""; savedRange = null; pendingDelete = ""; clearMediaSelection(); closeTagSuggestions();
      $("title").value = ""; $("tags").value = "";
      $("entry-date").value = new Date().toISOString().slice(0, 10);
      $("editor").innerHTML = "";
      renderEntryList();
      renderTagColors();
    }
    async function deleteEntry(id) {
      setStatus("Suppression…");
      try {
        await requireBridge("delete_entry").delete_entry(id);
        if (id === currentId) resetForm();
        await refreshEntries();
        setStatus("Entrée supprimée.");
      } catch (error) {
        setStatus(error.message || String(error), true);
      }
    }
    $("new-entry").addEventListener("click", () => { resetForm(); setStatus("Nouvelle entrée."); });
    function markMediaSaved(media) {
      Object.entries(media || {}).forEach(([token, path]) => {
        const element = $("editor").querySelector(`[data-media-token="${token}"]`);
        if (!element) return;
        const target = element.tagName === "VIDEO" ? element : element;
        target.setAttribute("src", path);     // the staged copy is gone; point at the imported file
        delete element.dataset.mediaToken;
      });
    }
    $("save").addEventListener("click", async () => {
      setStatus("Enregistrement…");
      try {
        const clean = serializeEditor();
        const entry = await requireBridge("save_entry").save_entry($("title").value, $("entry-date").value, $("tags").value, clean.html, currentId);
        currentId = entry.id;
        markMediaSaved(entry.media);
        await refreshEntries();
        await refreshTagColors();
        setStatus(clean.stripped.length
          ? `Entrée enregistrée : ${entry.id} — mise en forme non publiable retirée (${clean.stripped.join(", ")}).`
          : `Entrée enregistrée : ${entry.id}`, clean.stripped.length > 0);
      } catch (error) {
        setStatus(error.message || String(error), true);
      }
    });
    window.addEventListener("pywebviewready", async () => {
      bridgeReady = true;
      try {
        await refreshTagColors();
        await refreshEntries();
        setStatus(entries.length ? `${entries.length} entrée(s) existante(s).` : "Carnet vide — écrivez la première entrée.");
      } catch (error) {
        setStatus(error.message || String(error), true);
      }
    });
  </script>
</body>
</html>
